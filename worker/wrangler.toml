# Optional account sync for Quiet Bible: passkey sign-in and a small
# per-account store for highlights, bookmarks and settings.
name = "plain-bible-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The passkey "relying party" for callers not in ORIGINS. Each address in
# ORIGINS uses its own domain for passkeys; one account can have passkeys on
# several, which is how the app moved from bible.chama.community to
# myquietbible.com.
RP_ID = "myquietbible.com"
RP_NAME = "Quiet Bible"
# Comma-separated origins allowed to call this API and to use passkeys.
ORIGINS = "https://myquietbible.com,https://bible.chama.community"
# Sign-in codes come from this address, sent through Resend. Email sign-in
# stays off until the secrets RESEND_API_KEY and EMAIL_SECRET are set (the
# deploy script sets both, from the repository secret RESEND_API_KEY).
EMAIL_FROM = "Quiet Bible <hello@myquietbible.com>"

[[d1_databases]]
binding = "DB"
database_name = "plain-bible-sync"
# Filled in by the deploy workflow (scripts/deploy_sync.sh) from the account.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
