# Optional account sync for Plain Bible: passkey sign-in and a small
# per-account store for highlights, bookmarks and settings.
name = "plain-bible-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The passkey "relying party": the app's own domain. Passkeys only work on it.
RP_ID = "bible.chama.community"
RP_NAME = "Plain Bible"
# Comma-separated origins allowed to call this API and to use passkeys.
ORIGINS = "https://bible.chama.community"

[[d1_databases]]
binding = "DB"
database_name = "plain-bible-sync"
# Filled in by the deploy workflow (scripts/deploy_sync.sh) from the account.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
