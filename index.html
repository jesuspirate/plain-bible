<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Read, pray, share, repeat. The Bible in {{versions}} versions and {{languages}} languages, a 🙏 button to pray out loud about what you read, and small private circles to share your prayers. Free, no ads, works offline." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Quiet Bible" />
    <meta property="og:title" content="My Quiet Bible" />
    <meta property="og:description" content="Read, pray, share, repeat. The Bible in {{versions}} versions and {{languages}} languages, a 🙏 button to pray out loud about what you read, and small private circles to share your prayers. Free, no ads, works offline." />
    <meta name="twitter:description" content="Read, pray, share, repeat. The Bible in {{versions}} versions and {{languages}} languages, a 🙏 button to pray out loud about what you read, and small private circles to share your prayers. Free, no ads, works offline." />
    <meta property="og:url" content="https://myquietbible.com/" />
    <meta property="og:image" content="https://myquietbible.com/share.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lit lamp beside the words My Quiet Bible. Read, pray, share, repeat." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Quiet Bible" />
    <meta name="twitter:image" content="https://myquietbible.com/share.png" />
    <meta name="twitter:image:alt" content="A lit lamp beside the words My Quiet Bible. Read, pray, share, repeat." />
    <meta name="theme-color" content="#f4ecd8" />
    <script>
      // A first visit to the bare address goes to the welcome page (what this
      // is, and how to put it on a Home Screen); the Bible is one tap away
      // there. Never for an app on a Home Screen, which keeps its own storage
      // and so looks new; never for a link into the Bible (a verse someone
      // shared, a circle invite, a move link); and never again once the
      // Bible has been opened here.
      try {
        if (!location.hash && !location.search && !localStorage.getItem('plain-bible:settings') && !localStorage.getItem('plain-bible:welcomed')
          && matchMedia('(display-mode: browser)').matches && navigator.standalone !== true) {
          // On its way: hide the page, and don't start the Bible behind it (src/main.tsx).
          window.plainBibleWelcome = true
          document.documentElement.style.visibility = 'hidden'
          location.replace('welcome/')
        }
      } catch (e) {}

      // Apply the saved theme before the first paint, so the status bar and
      // page start in the right colour. On the first start, the theme picked
      // on the welcome page, if any.
      try {
        var t = (JSON.parse(localStorage.getItem('plain-bible:settings') || '{}').theme) || localStorage.getItem('plain-bible:welcome-theme') || 'sepia'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = { light: '#faf8f3', sepia: '#f4ecd8', dark: '#16161a' }[t]
      } catch (e) {}

      // If the app's code can't load (say a half-finished update left the
      // saved copy pointing at files the site no longer has), the page would
      // stay blank. Repair clears the saved app files (not your highlights,
      // settings or downloaded Bibles) and loads a fresh copy.
      window.plainBibleRepair = function () {
        var done = function () { location.reload() }
        try {
          var jobs = []
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister() }))
          }))
          if (window.caches) jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.filter(function (k) { return k !== 'bible-data' && k !== 'fonts' }).map(function (k) { return caches.delete(k) }))
          }))
          Promise.all(jobs).then(done, done)
          setTimeout(done, 4000)
        } catch (e) { done() }
      }
      ;(function () {
        var shown = false
        function stuck(failed) {
          if (window.plainBibleStarted || shown) return
          // A broken copy fixes itself once per visit when online.
          try {
            if (failed && navigator.onLine && !sessionStorage.getItem('plain-bible:repaired')) {
              sessionStorage.setItem('plain-bible:repaired', '1')
              // Only if the site can be reached: a fresh copy has to come from it.
              return fetch('./?fresh=' + Date.now(), { cache: 'no-store' }).then(function (r) {
                if (r.ok) window.plainBibleRepair(); else stuck(true)
              }, function () { stuck(true) })
            }
          } catch (e) {}
          shown = true
          var box = document.createElement('div')
          box.id = 'boot-stuck'
          box.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font:18px/1.5 system-ui,sans-serif;color:inherit'
          // In the app's language (src/i18n.ts), which can't load if the app didn't.
          var l = 'en'
          try {
            l = JSON.parse(localStorage.getItem('plain-bible:settings') || '{}').language || localStorage.getItem('plain-bible:welcome-lang') || ''
            if (!/^(en|fr|es)$/.test(l)) l = String(navigator.language).toLowerCase().split('-')[0]
          } catch (e) {}
          var W = {
            en: ['My Quiet Bible didn’t start properly.', 'My Quiet Bible is taking a while to start.', 'Your highlights, notes and settings are safe on this device.', 'Repair and reload', 'Just reload', 'Repairing…'],
            fr: ['My Quiet Bible n’a pas démarré correctement.', 'My Quiet Bible met du temps à démarrer.', 'Vos surlignages, notes et réglages sont en sécurité sur cet appareil.', 'Réparer et recharger', 'Simplement recharger', 'Réparation…'],
            es: ['My Quiet Bible no se inició bien.', 'My Quiet Bible está tardando en iniciarse.', 'Tus resaltados, notas y ajustes están a salvo en este dispositivo.', 'Reparar y recargar', 'Solo recargar', 'Reparando…'],
          }
          var w = W[l] || W.en
          box.innerHTML = '<p style="margin:0;max-width:22em">' + (failed ? w[0] : w[1])
            + '<br>' + w[2] + '</p>'
            + '<button type="button" style="font:inherit;font-weight:700;min-width:220px;min-height:52px;border-radius:26px;border:0;background:#7a4b1e;color:#fff">' + w[3] + '</button>'
            + '<button type="button" style="font:inherit;min-width:220px;min-height:52px;border-radius:26px;border:1px solid currentColor;background:none;color:inherit">' + w[4] + '</button>'
          var b = box.getElementsByTagName('button')
          b[0].onclick = function () { b[0].textContent = w[5]; window.plainBibleRepair() }
          b[1].onclick = function () { location.reload() }
          ;(document.body || document.documentElement).appendChild(box)
        }
        // The app's own script failing to load or run.
        addEventListener('error', function (e) {
          var t = e.target
          if (t && t.tagName === 'SCRIPT' || t && t.tagName === 'LINK' && t.rel === 'modulepreload') stuck(true)
          else if (t === window && !window.plainBibleStarted) setTimeout(function () { stuck(true) }, 0)
        }, true)
        setTimeout(function () { stuck(false) }, 12000)
      })()
    </script>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>My Quiet Bible</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
