<!doctype html>
<!-- The old address, bible.chama.community: every page lands here (Cloudflare
     Pages answers unknown paths with index.html) and goes on to the same
     place at myquietbible.com, #/read/... included. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My Quiet Bible</title>
<link rel="canonical" href="https://myquietbible.com/">
<script>location.replace('https://myquietbible.com' + location.pathname + location.search + location.hash)</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4ecd8; color: #3b2f22; font: 20px/1.5 Georgia, serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #6b4a2b; font-weight: bold; }
  @media (prefers-color-scheme: dark) { body { background: #1c1a17; color: #e8e0d0; } a { color: #d9b98c; } }
</style>
</head>
<body>
<p>Plain Bible is now My Quiet Bible.<br><a href="https://myquietbible.com/">Open myquietbible.com</a></p>
</body>
</html>
