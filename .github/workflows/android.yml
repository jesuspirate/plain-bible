# The Google Play app: a small Android shell (android/) that opens
# https://myquietbible.com full screen in the phone's Chrome, so it is the same
# Bible, offline and all, with nothing extra to keep up to date. See
# android/README.md.
#
# Pull requests that touch android/ build it, to check it still compiles.
# Run it by hand (Actions → Android app → Run workflow) to:
#   - "Make upload key": once, before the first upload. Needs the secret
#     ANDROID_KEY_PASSWORD (a long password you choose and keep).
#   - "Build for Google Play": a signed .aab to upload to Play Console. Needs
#     ANDROID_KEY_PASSWORD and ANDROID_KEYSTORE_BASE64.
name: Android app

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: ['Build for Google Play', 'Make upload key']
        default: 'Build for Google Play'

permissions:
  contents: read

jobs:
  key:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'Make upload key'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make the key
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ ${#ANDROID_KEY_PASSWORD} -lt 12 ]; then
            echo "::error::Add the secret ANDROID_KEY_PASSWORD first (12 characters or more)."; exit 1
          fi
          mkdir key
          keytool -genkeypair -v -storetype PKCS12 -keystore key/upload.keystore -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env ANDROID_KEY_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -dname "CN=My Quiet Bible, O=My Quiet Bible"
          base64 -w0 key/upload.keystore > key/upload.keystore.base64.txt
          {
            echo "## Upload key made"
            echo "Download **upload-key** below, keep upload.keystore somewhere safe (with its password),"
            echo "and paste the text of upload.keystore.base64.txt into a new secret named ANDROID_KEYSTORE_BASE64."
            echo
            echo "Upload key SHA-256:"
            echo '```'
            keytool -list -v -keystore key/upload.keystore -storepass:env ANDROID_KEY_PASSWORD | grep 'SHA256:' | sed 's/.*SHA256: //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The keystore is locked with ANDROID_KEY_PASSWORD, and the download
      # disappears after a day.
      - uses: actions/upload-artifact@v4
        with:
          name: upload-key
          path: key/
          retention-days: 1

  build:
    if: github.event_name == 'pull_request' || inputs.task == 'Build for Google Play'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Unlock the upload key
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Run 'Make upload key' first and add the secret ANDROID_KEYSTORE_BASE64."; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Every upload to Google Play needs a higher version number.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease
      - if: github.event_name == 'workflow_dispatch'
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: my-quiet-bible-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
