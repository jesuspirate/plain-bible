name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Building (which also runs for pull requests) only reads the repository.
# Publishing to Pages is allowed in the deploy job alone, further down.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SYNC_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Cache source texts
        uses: actions/cache@v6
        with:
          path: sources
          key: sources-${{ hashFiles('scripts/fetch_sources.sh') }}
      - name: Build Bible data
        run: bash scripts/fetch_sources.sh && python3 scripts/build_data.py
      - name: Check sync service types
        run: cd worker && npm ci --silent && npm run typecheck
      # Optional account sync. Runs only on main, and only once the Cloudflare
      # secrets are set in the repository.
      - name: Deploy sync service
        if: github.event_name != 'pull_request' && env.HAS_SYNC_SECRETS == 'true'
        # A sync problem must never block the Bible itself from deploying;
        # without VITE_SYNC_URL the app simply hides the account section.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: bash scripts/deploy_sync.sh >> "$GITHUB_ENV"
      - run: npm run build
      # Lets the iOS app (ios/) use this site's passkeys and open its links.
      # Turns on once the APPLE_TEAM_ID repository variable is set.
      - name: Apple app site association
        if: vars.APPLE_TEAM_ID != ''
        env:
          APP_ID: ${{ vars.APPLE_TEAM_ID }}.com.myquietbible.ios
        run: |
          mkdir -p dist/.well-known
          cat > dist/.well-known/apple-app-site-association <<JSON
          {"webcredentials":{"apps":["$APP_ID"]},
           "applinks":{"details":[{"appIDs":["$APP_ID"],"components":[
             {"/":"/support/*","exclude":true},{"/":"/welcome/*","exclude":true},{"/":"/privacy.html","exclude":true},{"/":"/*"}]}]}}
          JSON
          python3 -m json.tool dist/.well-known/apple-app-site-association
      # Links the Play Store app to this site (android/README.md).
      - name: Android app link
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: bash scripts/assetlinks.sh
      # The old address (bible.chama.community), served from Cloudflare Pages,
      # now redirects to myquietbible.com. Never blocks the main site.
      - name: Deploy old address
        if: github.event_name != 'pull_request' && env.HAS_SYNC_SECRETS == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy_old_address.sh
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keeps dist/.well-known (Lightning address, app links). The action drops dot-folders otherwise.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
