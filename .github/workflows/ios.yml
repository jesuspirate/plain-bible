name: iOS app

# Builds the iOS app on GitHub's Macs, so no Mac is needed.
# - Pull requests and pushes to main that touch the app: a test build that
#   checks everything compiles (no Apple account needed).
# - Run it by hand (Actions → iOS app → Run workflow) to sign the app and
#   upload it to TestFlight / App Store Connect. That needs the Apple secrets
#   described in ios/README.md.

on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'capacitor.config.ts', 'package*.json', 'scripts/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'src/**', 'capacitor.config.ts', 'package*.json', 'scripts/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The account sync service (worker/). The app hides sign-in without it.
  VITE_SYNC_URL: https://plain-bible-sync.wqk45tyy.workers.dev

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Cache source texts
        uses: actions/cache@v4
        with:
          path: sources
          key: sources-${{ hashFiles('scripts/fetch_sources.sh') }}
      - name: Build Bible data
        run: bash scripts/fetch_sources.sh && python3 scripts/build_data.py
      - name: Build the app and copy it into the Xcode project
        run: bash scripts/build_ios.sh

      # (Steps run with pipefail, so a failed build fails the step despite `tail`.)
      - name: Test build (simulator, unsigned)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Archive and upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::$v is not set. See ios/README.md."; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Signing certificates and profiles are created and kept by Apple
          # (cloud signing), so nothing else needs to be stored here.
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${auth[@]}" archive | tail -n 40
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"
          echo "Uploaded build ${{ github.run_number }}. It shows up in TestFlight after Apple processes it (5 to 30 minutes)."
