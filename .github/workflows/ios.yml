name: iOS app

# Checks that the iOS app (ios/) still builds. It is a small native shell
# around myquietbible.com, so it only needs building when ios/ changes.
# The iPhone app carries the Apple Watch app, so this builds that too.
# Signing and sending it to the App Store is ios-release.yml (see ios/README.md).

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test build (simulator, unsigned)
        # No -sdk here: it would build the watch app for the iPhone too. The
        # destination picks the iPhone simulator, and the watch app inside
        # follows with the watch simulator. -quiet shows only warnings and errors.
        run: |
          xcodebuild -project ios/QuietBible.xcodeproj -scheme QuietBible -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Start a prayer in the watch app (watch simulator)
        run: bash ios/watch-smoke.sh
