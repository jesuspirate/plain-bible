name: iOS app

# Checks that the iOS app (ios/) still builds. It is a small native shell
# around myquietbible.com, so it only needs building when ios/ changes.
# Signing and sending it to the App Store happen in Xcode (see ios/README.md).

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test build (simulator, unsigned)
        # shell: bash adds pipefail, so a failed build fails the step despite `tail`.
        shell: bash
        run: |
          xcodebuild -project ios/QuietBible.xcodeproj -scheme QuietBible -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
