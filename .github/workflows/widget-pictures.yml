name: Widget pictures

# Draws the iPhone verse-of-the-day widget (ios/widget-pictures) so a change
# to it can be seen without a phone. The picture is kept with the run, and
# also as a lone commit at refs/widget-pictures/pr-<number> (not a branch),
# so it can be fetched with git alone.

on:
  pull_request:
    paths: ['ios/QuietBibleHome/**', 'ios/Shared/**', 'ios/widget-pictures/**', '.github/workflows/widget-pictures.yml']
  workflow_dispatch:

# Read-only by default. Only the small "keep" job below may write, and it
# runs none of the pull request's own code: it only stores the pictures.
permissions:
  contents: read

jobs:
  draw:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Draw
        run: bash ios/widget-pictures/draw.sh pictures
      - uses: actions/upload-artifact@v7
        with:
          name: widget-pictures
          path: pictures/

  keep:
    needs: draw
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: widget-pictures
          path: pictures/
      - name: Keep as a git ref
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          tree=$(for f in pictures/*.png; do printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"; done | git mktree)
          commit=$(git -c user.name=pictures -c user.email=pictures@localhost commit-tree "$tree" -m "Widget pictures for #$PR")
          git push -f origin "$commit:refs/widget-pictures/pr-$PR"
