name: iPhone Duo pictures

# Takes pictures of the app on Apple's iPhone Duo simulator (the folding
# iPhone), built with Xcode 27, as the starting point for its App Store
# pictures. Kept with the run, and as a lone commit at
# refs/duo-pictures/pr-<number> (not a branch).

on:
  pull_request:
    paths: ['ios/duo-pictures/**', '.github/workflows/duo-pictures.yml']
  workflow_dispatch:

# Read-only by default. Only the small "keep" job below may write, and it
# runs none of the pull request's own code: it only stores the pictures.
permissions:
  contents: read

jobs:
  take:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Take
        run: bash ios/duo-pictures/take.sh pictures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: duo-pictures
          path: pictures/

  keep:
    needs: take
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: duo-pictures
          path: pictures/
      - name: Keep as a git ref
        if: hashFiles('pictures/*') != ''
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          tree=$(for f in pictures/*; do printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"; done | git mktree)
          commit=$(git -c user.name=pictures -c user.email=pictures@localhost commit-tree "$tree" -m "Duo pictures for #$PR")
          git push -f origin "$commit:refs/duo-pictures/pr-$PR"
